[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccv"
version = "0.1.0"
description = "Calibrated Completion Verifiers: calibrated verification and budgeted search for coding and terminal agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Manav Agarwal", email = "manav@hanaml.com"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
paper = ["scipy>=1.10", "matplotlib>=3.7"]
hf = ["torch>=2.2", "transformers>=4.45"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ccv-demo = "ccv.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# The report's generator and figure scripts are dense numerical code: compound statements are allowed there,
# and pyflakes still applies.
"paper/*" = ["E401", "E701", "E702", "E731", "E741"]
